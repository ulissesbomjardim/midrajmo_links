name: PHP Syntax Check

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.2', '7.4', '8.0']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo, pdo_mysql

    - name: Validate PHP syntax in app/
      run: find app -name "*.php" -exec php -l {} \;

    - name: Validate PHP syntax in public/
      run: find public -name "*.php" -exec php -l {} \;

    - name: Check .env.example exists
      run: test -f .env.example

    - name: Check database schema exists
      run: test -f database/schema.sql
