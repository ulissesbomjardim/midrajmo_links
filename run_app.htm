<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Conexão MySQL</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(560px, 92vw);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
    }
    h1 { margin-top: 0; }
    button {
      background: #22d3ee;
      color: #05202a;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    pre {
      margin-top: 14px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Teste de Conexão MySQL</h1>
    <p>Clique para testar a conexão usando as credenciais do arquivo <b>.env</b>.</p>
    <button id="healthBtn">Verificar servidor</button>
    <button id="runTest">Executar teste</button>
    <pre id="result">Aguardando execução...</pre>
  </div>

  <script>
    const healthBtn = document.getElementById('healthBtn');
    const button = document.getElementById('runTest');
    const result = document.getElementById('result');

    function getApiUrl(endpoint) {
      // Detecta se está em /links/ ou raiz
      const pathname = window.location.pathname;
      
      // Se está em /links/run_app.htm, volta para /links e chama /links/...
      if (pathname.includes('/links/')) {
        return '/links' + endpoint;
      }
      
      // Se está em localhost:8001/run_app.htm, chama /...
      return endpoint;
    }

    async function tryEndpoint(url) {
      const response = await fetch(url);
      const rawText = await response.text();
      
      try {
        return JSON.parse(rawText);
      } catch (_) {
        throw new Error('Resposta não é JSON');
      }
    }

    healthBtn.addEventListener('click', async function () {
      result.className = '';
      result.textContent = 'Verificando servidor...';

      const urls = [
        getApiUrl('/public/test-connection.php'),  // PHP (tem mais chance de funcionar)
        getApiUrl('/health'),  // Python app
      ];

      for (const url of urls) {
        try {
          console.log('Tentando:', url);
          const data = await tryEndpoint(url);
          
          result.className = 'ok';
          result.textContent = 'Servidor respondendo (via ' + (url.includes('.php') ? 'PHP' : 'Python') + '):\n' + JSON.stringify(data, null, 2);
          return;
        } catch (error) {
          console.log('Falhou:', url, error.message);
        }
      }

      result.className = 'err';
      result.textContent = 'Servidor não está respondendo em nenhum endpoint.';
    });

    button.addEventListener('click', async function () {
      result.className = '';
      result.textContent = 'Executando...';

      try {
      const urls = [
        getApiUrl('/public/test-connection.php'),  // PHP endpoint
        getApiUrl('/api/test-connection'),  // Python endpoint
      ];

      for (const url of urls) {
        try {
          console.log('Tentando testar conexão em:', url);
          const data = await tryEndpoint(url);
          
          if (data.ok) {
            result.className = 'ok';
          } else {
            result.className = 'err';
          }

          result.textContent = JSON.stringify(data, null, 2);
          return;
        } catch (error) {
          console.log('Falhou:', url, error.message);
        }
      }

      result.className = 'err';
      result.textContent = 'Nenhum endpoint de teste disponível.';
  </script>
</body>
</html>
